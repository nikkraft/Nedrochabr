name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Nedrochabr-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Keystore
        working-directory: Nedrochabr
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "Нет секрета KS_B64: Settings, Secrets and variables, Actions"; exit 1; fi
          echo "$KS_B64" | base64 -d > release.jks
      - name: Build
        working-directory: Nedrochabr
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon
      - run: cp Nedrochabr/app/build/outputs/apk/release/app-release.apk Nedrochabr.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Nedrochabr v${{ github.run_number }}
          files: Nedrochabr.apk
